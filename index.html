:root{--bg1:#F1EBFF;--bg2:#CFC0FF;--ink:#2B1A63;--muted:#5A3BB8;--gold:#E9A100;--ring:#F1EBFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2B1A63;--bg2:#5A3BB8;--ink:#FFFFFF;--muted:#DCD0FF;--gold:#F7B733;--ring:#2B1A63}}
:root[data-theme="dark"]{--bg1:#2B1A63;--bg2:#5A3BB8;--ink:#FFFFFF;--muted:#DCD0FF;--gold:#F7B733;--ring:#2B1A63}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg1) radial-gradient(120% 80% at 50% 28%,var(--bg2),var(--bg1));color:var(--ink);
  font-family:"Baloo Chettan 2","Noto Sans Malayalam","Manjari",system-ui,sans-serif;
  display:flex;justify-content:center;align-items:center;overflow-x:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 16px}
#bunt{width:100%;max-width:400px;height:auto;display:block;margin-bottom:6px}
h1{margin:0;font-weight:800;font-size:clamp(34px,9.8vw,52px);line-height:1.1;white-space:nowrap;text-shadow:0 3px 0 rgba(43,26,99,.28)}
.l{display:inline-block;color:var(--c);animation:drop .75s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--i)*55ms + 150ms)}
@keyframes drop{from{transform:translateY(-1.3em) scale(.3) rotate(-14deg);opacity:0}}
.frame{margin:14px 0 10px;width:min(78vw,300px,max(170px,calc((100svh - 340px) * .78)));aspect-ratio:687/879;
  border:6px solid var(--gold);border-radius:50% 50% 28px 28px/32% 32% 28px 28px;overflow:hidden;
  box-shadow:0 0 0 4px var(--ring),0 0 0 6px var(--gold),0 18px 40px rgba(30,10,80,.4);background:var(--bg2)}
.frame img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.frame.pop{animation:pop .5s ease-out}
@keyframes pop{40%{transform:scale(1.045) rotate(-1deg)}}
h2{margin:0;font-weight:800;font-size:clamp(40px,12vw,54px);line-height:1.1;color:var(--gold)}
.bl{margin:2px 0 0;font-weight:600;font-size:clamp(17px,4.8vw,20px);line-height:1.5}
.hint{margin:10px 0 0;font-size:15px;color:var(--muted);transition:opacity .6s}
.hint.off{opacity:0}
#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){.l,.frame.pop{animation:none}}
</style>

  <h2 id="nm"></h2>
  <p class="bl">ജന്മദിനാശംസകൾ!<br>ഈ ചിരി എന്നും കൂടെയുണ്ടാകട്ടെ.</p>
  <p class="hint" id="hint">ഫോട്ടോയിൽ ഒന്ന് തൊടൂ</p>
</main>
<canvas id="c" aria-hidden="true"></canvas>
<script>
const NAME=(new URLSearchParams(location.search).get('name')||'Shivashree').trim().slice(0,24);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAL=['#F2A900','#E8473D','#1FB58F','#E8559A','#3D8BEA'];
const COL=[...PAL,'#FFFFFF'];
const $=id=>document.getElementById(id);
$('nm').textContent=NAME;
document.title='Happy Birthday '+NAME;

// Title: each letter drops in once on load
$('t').innerHTML=[...'Happy Birthday'].map((ch,i)=>ch===' '?'<span class="l" style="--i:'+i+'">&nbsp;</span>':'<span class="l" aria-hidden="true" style="--i:'+i+';--c:'+PAL[i%PAL.length]+'">'+ch+'</span>').join('');

// Bunting
let flags='<path d="M0 3 Q200 12 400 3" stroke="#F7B733" stroke-width="2" fill="none"/>';
for(let i=0;i<10;i++){const x=i*40+2,y=3+Math.sin(i/9*Math.PI)*4.5;flags+='<path d="M'+x+' '+y+' L'+(x+36)+' '+y+' L'+(x+18)+' '+(y+30)+'Z" fill="'+PAL[i%PAL.length]+'"/>';}
$('bunt').innerHTML=flags;

// Confetti
const cv=$('c'),cx=cv.getContext('2d'),ph=$('ph');
let W,H,P=[];const MAX=RM?60:230;
function fit(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
const rnd=(a,b)=>a+Math.random()*(b-a);
function mk(x,y,vx,vy){return{x,y,vx,vy,w:rnd(6,11),h:rnd(3,6),r:rnd(0,6.28),vr:rnd(-.25,.25),ph:rnd(0,6.28),tv:rnd(1.6,2.8),c:COL[Math.random()*COL.length|0],s:Math.random()<.3}}
function burst(){
  const r=ph.getBoundingClientRect(),n=RM?24:80;
  for(let i=0;i<n;i++){const left=i%2===0,a=left?rnd(-1.4,-.7):rnd(-2.45,-1.75),sp=rnd(9,16);
    P.push(mk(left?r.left:r.right,r.bottom-r.height*.2,Math.cos(a)*sp,Math.sin(a)*sp));}
}
const t0=performance.now();
(function loop(now){
  cx.clearRect(0,0,W,H);
  if(!document.hidden&&P.length<MAX&&Math.random()<(RM?.05:(now-t0>9000?.1:.45))){
    const r=ph.getBoundingClientRect();
    P.push(mk(rnd(r.left-24,r.right+24),r.top-14,rnd(-.3,.3),rnd(1,2)));
  }
  P=P.filter(p=>p.y<H+20);
  for(const p of P){
    p.vy=Math.min(p.vy+.22,p.tv);p.vx*=.985;p.ph+=.08;p.r+=p.vr;
    p.x+=p.vx+Math.sin(p.ph)*.6;p.y+=p.vy;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.s){cx.beginPath();cx.arc(0,0,p.h*.7,0,6.3);cx.fill()}
    else{cx.scale(1,Math.cos(p.ph*1.7));cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
    cx.restore();
  }
  requestAnimationFrame(loop);
})(t0);

// Voice wish
let spoken=false,taps=0;
function speak(){
  if(!('speechSynthesis' in window))return;
  try{
    const s=speechSynthesis;s.cancel();
    const u=new SpeechSynthesisUtterance('Happy birthday, '+NAME+'!');
    u.lang='en-IN';u.rate=.9;u.pitch=1.3;u.onstart=()=>{spoken=true};
    s.speak(u);
    if((s.getVoices()||[]).some(v=>/^ml/i.test(v.lang))){
      const m=new SpeechSynthesisUtterance('ജന്മദിനാശംസകൾ');m.lang='ml-IN';m.rate=.9;m.pitch=1.3;s.speak(m);
    }
  }catch(e){}
}

// Open: wish + confetti right away (phones may block sound until the first tap)
setTimeout(burst,450);
setTimeout(speak,700);
document.addEventListener('pointerdown',()=>{
  taps++;burst();
  ph.classList.remove('pop');void ph.offsetWidth;ph.classList.add('pop');
  if(!spoken||taps>1)speak();
  $('hint').classList.add('off');
});
</script>
